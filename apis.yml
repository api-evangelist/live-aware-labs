name: Live Aware Labs
description: >-
  Live Aware Labs (LIVE AWARE) is a virtual playtesting and player-insights lab for game
  studios and researchers. The platform consolidates gameplay footage, player feedback, and
  community discussion from sources such as Discord, Twitch, YouTube, and internal playtests
  into a single dashboard, then applies AI to surface trends, player sentiment, and critical
  feedback in real time. A PC-based SDK captures video, telemetry, and in-game events, with
  plugins for Unreal Engine and Unity and no-code integrations into Slack, Jira, Monday.com,
  and OBS. Live Aware Labs is backed by a16z and was added to the API Evangelist network as a
  venture-portfolio lead; this profile is enriched from the company's public web surface.
